services:
  postgres:
    image: postgres:17
    container_name: kairos-postgres
    restart: unless-stopped

    env_file:
      - ./backend/.env.docker

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    container_name: kairos-backend
    restart: unless-stopped
    build:
      context: ./backend
    expose:
      - "3001"
    env_file:
      - ./backend/.env.docker
    depends_on:
      - postgres

  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost/api/v1
    container_name: kairos-frontend
    expose:
      - "3000"
    env_file:
      - ./frontend/.env
    depends_on:
      - backend

  nginx:
    image: nginx
    container_name: kairos-nginx
    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
